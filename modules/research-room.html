<body><div class="public-demo-badge" role="note">公开演示 · 所有业务数据均为虚构</div>
  <header class="room-top"><a href="../index.html#island">← 返回研究岛</a><a class="room-brand" href="../index.html#island">RETAIL DATA RESEARCH ISLAND</a><a href="?module=overview&view=flows&scope=all">流程与成果 ↗</a></header>
  <main id="room">
    <div class="room-heading"><div><p class="eyebrow" id="roomEn"></p><h1 id="roomName"></h1><p id="roomDescription"></p></div><span class="room-number" id="roomNumber"></span></div>
    <nav class="room-tabs" aria-label="研究空间内容"><button class="active" data-view="resources">看板与工具</button><button data-view="flows">固定流程</button><button data-view="islands">岛屿导览</button><span id="snapshotTime"></span></nav>

  </main>
  <dialog id="viewer"><header><div><small id="viewerType"></small><h2 id="viewerTitle"></h2></div><a id="viewerOpen" target="_blank" rel="noopener">新窗口打开 ↗</a><button id="closeViewer" aria-label="关闭预览">×</button></header><p id="viewerNote"></p><div id="frameHost"></div></dialog>
