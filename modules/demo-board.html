<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虚构数据研究示例</title><link rel="stylesheet" href="research-room.css"><link rel="stylesheet" href="../public-demo.css"><style>main{padding-top:35px}.demo-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:25px 0}.demo-kpis article{background:#ffffffba;border:1px solid var(--line);padding:24px;border-radius:20px}.demo-kpis b{display:block;font:32px Georgia;margin-top:12px}.demo-kpis small{color:var(--muted)}.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.filters select,.filters button{padding:10px 17px;border:1px solid var(--line);border-radius:23px;background:white}.bars{background:#ffffffa0;border-radius:20px;padding:25px;border:1px solid var(--line)}.bar{display:grid;grid-template-columns:90px 1fr 75px;gap:14px;align-items:center;margin:18px 0;font-size:12px}.bar i{display:block;height:16px;border-radius:6px;background:linear-gradient(90deg,#a7cebb,#799f90)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:20px;background:#fffdf8;margin-top:24px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:15px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:500}.note{font-size:12px;color:var(--muted);line-height:1.8}.diagnosis{padding:20px;border-radius:18px;background:#ece8f3;color:#6e607f;line-height:1.9;margin:20px 0}@media(max-width:600px){.demo-kpis{grid-template-columns:1fr}.bar{grid-template-columns:70px 1fr 55px}}</style></head><body><div class="public-demo-badge">公开演示 · 所有业务数据均为虚构</div><main><p class="eyebrow">RETAIL RESEARCH / FICTIONAL DATA</p><h1 id="title">经营研究示例</h1><p class="note">这里展示研究模块的交互方式。门店、商品、日期和金额完全虚构，与任何真实经营记录无关。</p><div class="filters"><label>门店 <select id="store"><option value="">全部示例门店</option><option>示例门店A</option><option>示例门店B</option><option>示例门店C</option></select></label><label>观察期 <select id="period"><option value="1">示例周期一</option><option value="1.15">示例周期二</option></select></label><button id="export">导出示例 CSV ↓</button></div><section class="demo-kpis"><article><small id="metricLabel">示例销售额</small><b id="sales"></b></article><article><small>示例订单数</small><b id="orders"></b></article><article><small>示例毛利率</small><b id="margin"></b></article></section><section id="diagnosis" class="diagnosis" hidden>示例诊断：先核对流量、转化和可售变化，再对照活动与成本。此处为固定规则示例，不调用外部模型，也不执行平台操作。</section><section class="bars"><p class="eyebrow" id="chartTitle">示例门店对比</p><div id="chart"></div></section><div class="table-wrap"><table><thead><tr><th>门店</th><th>示例商品</th><th>渠道</th><th>销量</th><th>销售额</th><th>毛利</th></tr></thead><tbody id="rows"></tbody></table></div><p class="note">所有导出内容也只包含本页虚构数据。生产环境的数据库与任务服务未包含在公开版本中。</p></main><script src="../catalog.js"></script><script src="demo-board.js"></script></body></html>
