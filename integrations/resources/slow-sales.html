<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>滞销商品清单导出</title>
<style>
:root{font-family:"Microsoft YaHei",sans-serif;color:#244e4b;background:#f5f8f2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(120deg,#fff9eb,#e8f3e9 62%,#daece8);min-height:100vh}header{padding:28px max(4vw,20px) 12px}small{color:#6b8c82}h1{font-family:SimSun,serif;font-size:clamp(27px,3vw,42px);font-weight:500;margin:9px 0}p{line-height:1.7;color:#66857c;font-size:13px;margin:0}main{display:grid;grid-template-columns:minmax(280px,350px) 1fr;gap:24px;padding:22px max(4vw,20px) 32px}.panel{background:#fffdf1de;border:1px solid #ffffff;border-radius:18px;padding:24px;box-shadow:0 16px 45px #315f5912}.drop{display:grid;place-items:center;text-align:center;min-height:148px;border:1.5px dashed #a3c7b8;border-radius:13px;background:#eff7ec;cursor:pointer;padding:20px}.drop:hover{background:#e5f1e4}.drop b{font-size:16px;font-weight:500}.drop small{font-size:11px;margin-top:8px}input[type=file]{display:none}label.field{display:block;font-size:12px;margin:22px 0 10px;color:#50776d}select,input[type=number]{width:100%;border:1px solid #cfdfd3;border-radius:9px;background:#fff;padding:11px 12px;color:#244e4b;font:inherit;font-size:13px}.threshold{display:flex;align-items:center;gap:10px}.threshold input{max-width:100px}.threshold span{font-size:12px;color:#66857c}.hint{font-size:11px;line-height:1.65;margin-top:18px}.actions{display:flex;align-items:center;gap:16px;margin-top:24px;flex-wrap:wrap}button{border:0;background:#315f59;color:white;border-radius:24px;padding:12px 19px;cursor:pointer;font-size:13px}button:disabled{opacity:.4;cursor:not-allowed}#status{font-size:12px;color:#50776d}.summary{display:flex;gap:18px;align-items:baseline;margin:4px 0 18px}.summary strong{font-family:Georgia,serif;font-size:35px;font-weight:400;color:#315f59}.summary span{font-size:12px;color:#65867c}.table-wrap{max-height:59vh;overflow:auto;border:1px solid #e0e9df;border-radius:10px;background:#fff}table{border-collapse:collapse;width:100%;min-width:700px;font-size:12px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #edf1eb;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;background:#e6f1e7;color:#315f59;z-index:1;font-weight:500}tr:hover{background:#f8faf5}.empty{min-height:300px;display:grid;place-items:center;color:#78948a;font-size:13px;text-align:center;padding:25px}@media(max-width:750px){main{grid-template-columns:1fr}.table-wrap{max-height:45vh}header{padding-top:20px}}
</style>
<link rel="stylesheet" href="../../public-demo.css"></head>
<body><div class="public-demo-badge" role="note">公开演示 · 所有业务数据均为虚构</div>
<header><small>实际材料 / 活动组</small><h1>滞销商品清单导出</h1><p>导入商品销量文件，按销量阈值筛选并下载清单。支持 CSV、TSV 和 XLSX。</p></header>
<main><section class="panel"><label class="drop" for="file"><b>选择商品销量文件 ↗</b><small id="filename">把本机导出的文件放进来</small></label><input id="file" type="file" accept=".csv,.tsv,.txt,.xlsx"><label class="field" for="salesColumn">销量字段</label><select id="salesColumn" disabled><option>导入文件后选择</option></select><label class="field" for="threshold">筛选范围</label><div class="threshold"><span>销量 ≤</span><input id="threshold" type="number" min="0" step="1" value="2"><span>件</span></div><p class="hint">使用文件中已有的销量字段筛选；不会补造商品数据，也不会把文件上传到服务器。请先确认所选字段的统计周期与汇报口径一致。</p><div class="actions"><button id="download" disabled>下载筛选清单 ↓</button><span id="status" role="status">等待导入</span></div></section><section class="panel"><div class="summary"><strong id="count">—</strong><span id="summary">导入后显示筛选结果</span></div><div id="preview" class="table-wrap"><div class="empty">选择文件后，这里会显示符合条件的商品。</div></div></section></main>
<script src="jszip.min.js"></script><script>
const $=s=>document.querySelector(s);let headers=[],rows=[],filtered=[],fileBase='商品';
function parseDelimited(text,delimiter){const out=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(!quoted&&ch===delimiter){row.push(cell);cell=''}else if(!quoted&&(ch==='\n'||ch==='\r')){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))out.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(v=>v.trim()))out.push(row);return out}
function textFrom(buffer){let value=new TextDecoder('utf-8').decode(buffer);if((value.match(/�/g)||[]).length>3){const gbk=new TextDecoder('gbk').decode(buffer);if((gbk.match(/�/g)||[]).length<(value.match(/�/g)||[]).length)value=gbk}return value.replace(/^\uFEFF/,'')}
function xml(source){const doc=new DOMParser().parseFromString(source,'application/xml');if(doc.querySelector('parsererror'))throw Error('Excel 文件内容无法解析');return doc}
function all(node,name){return Array.from(node.getElementsByTagName(name))}
function colIndex(ref){const letters=(ref.match(/^[A-Z]+/i)||['A'])[0].toUpperCase();let n=0;for(const ch of letters)n=n*26+ch.charCodeAt(0)-64;return n-1}
async function parseXlsx(buffer){const zip=await JSZip.loadAsync(buffer);const sheetName=Object.keys(zip.files).filter(x=>/^xl\/worksheets\/sheet\d+\.xml$/.test(x)).sort()[0];if(!sheetName)throw Error('没有找到 Excel 工作表');const sheet=xml(await zip.file(sheetName).async('string'));let shared=[];if(zip.file('xl/sharedStrings.xml')){const doc=xml(await zip.file('xl/sharedStrings.xml').async('string'));shared=all(doc,'si').map(si=>all(si,'t').map(t=>t.textContent).join(''))}return all(sheet,'row').map(row=>{const cells=[];for(const c of all(row,'c')){const index=colIndex(c.getAttribute('r')||'A');const type=c.getAttribute('t');let value=type==='inlineStr'?all(c,'t').map(t=>t.textContent).join(''):all(c,'v')[0]?.textContent||'';if(type==='s')value=shared[Number(value)]||'';cells[index]=value}return cells.map(x=>x??'')}).filter(row=>row.some(x=>String(x).trim()))}
function chooseHeader(data){const i=data.findIndex((row,index)=>index<15&&row.some(v=>/(月销|销量|销售量|动销)/.test(String(v))));return i<0?0:i}
function selectSalesColumn(){const options=headers.map((h,i)=>({h,i})).filter(x=>/(月销|销量|销售量|动销)/.test(x.h));return(options[0]||{i:0}).i}
function update(){if(!headers.length)return;const column=Number($('#salesColumn').value),max=Number($('#threshold').value);filtered=rows.filter(row=>{const raw=String(row[column]??'').replace(/,/g,'').trim();return raw!==''&&Number.isFinite(Number(raw))&&Number(raw)<=max});$('#count').textContent=filtered.length.toLocaleString();$('#summary').textContent=`符合条件 / 共 ${rows.length.toLocaleString()} 条商品记录`;$('#download').disabled=!filtered.length;const box=$('#preview');box.replaceChildren();if(!filtered.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='没有符合条件的商品，请调整销量字段或阈值。';box.append(empty);return}const table=document.createElement('table'),thead=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(h=>{const th=document.createElement('th');th.textContent=h;tr.append(th)});thead.append(tr);table.append(thead);const tbody=document.createElement('tbody');filtered.slice(0,40).forEach(row=>{const tr=document.createElement('tr');headers.forEach((_,i)=>{const td=document.createElement('td');td.textContent=row[i]??'';tr.append(td)});tbody.append(tr)});table.append(tbody);box.append(table);$('#status').textContent=`已筛选 ${filtered.length.toLocaleString()} 条`}
$('#file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;$('#status').textContent='正在读取…';$('#filename').textContent=file.name;fileBase=file.name.replace(/\.[^.]+$/,'');try{const buffer=await file.arrayBuffer(),data=/\.xlsx$/i.test(file.name)?await parseXlsx(buffer):parseDelimited(textFrom(buffer),/\.tsv$/i.test(file.name)?'\t':',');if(!data.length)throw Error('文件里没有可读取的记录');const headerRow=chooseHeader(data);headers=data[headerRow].map((v,i)=>String(v||`第${i+1}列`).trim());rows=data.slice(headerRow+1).filter(row=>row.some(v=>String(v??'').trim()));const select=$('#salesColumn');select.replaceChildren(...headers.map((h,i)=>{const option=document.createElement('option');option.value=i;option.textContent=h;return option}));select.disabled=false;select.value=selectSalesColumn();update()}catch(error){headers=[];rows=[];filtered=[];$('#count').textContent='—';$('#status').textContent=error.message;$('#download').disabled=true}});
$('#salesColumn').addEventListener('change',update);$('#threshold').addEventListener('input',update);
$('#download').addEventListener('click',()=>{if(!filtered.length)return;const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\uFEFF'+[headers,...filtered].map(row=>row.map(quote).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`${fileBase}_滞销商品清单.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
</script>
</body></html>
