prompt = "每天北京时间（Asia/Shanghai）上午8:30开始，严格按顺序执行：先用本地/MySQL真实底数和美团、饿了么“新版公式”模板计算生成两份业绩表，核对合格后通过消息机器人CLI以本人角色01身份（--as user）发给角色09；再更新门店经营洞察看板，核对打包后用消息机器人bot发到飞书“业务群B”群。用户已明确授权每日发送，并在${REFERENCE_DATE_001}明确恢复发送；之前“先不发”是临时要求，不再阻止本流程。开始时间是8:30，不要求未算完就发送。\n\n工作目录为 ${LOCAL_PATH_009}，正式看板和数据脚本位于 outputs\\布局原型_${REFERENCE_DATE_002}。正式文件为 门店经营洞察_交互原型.html 和 门店经营洞察_数据版.html。沿用已经完成的版本和口径，不重建示例原型。\n\n先以消息机器人 CLI（${LOCAL_PATH_010}，应用 profile ${MESSAGE_ID_001}，--as bot）搜索并下载新发布的美团、饿了么业绩表。参考 download_new_performance_${REFERENCE_DATE_002}.py 的已验证流程。检查已有文件是否在飞书被更新，既避免重复下载，也不要漏掉同名新版本。根据运行日动态选择月份、年份及输出日期，不能把${REFERENCE_DATE_003}、${REFERENCE_DATE_004}等历史日期写死。以最新实际可访问业绩表更新现有真实数据；读取新增或改版表的日经营数据、一级类目和门店标签，保持日期与门店键唯一。页面当前经营模块仍按现有美团口径展示，双平台盈亏平衡线按已确认固定成本合计口径。\n\n表格阶段统一执行 正常口径每日业绩.py --download --promote，使用当天最新真实完整底表及正常“新版公式”口径生成美团、饿了么两份新业绩表。该入口按运行日和实际业务日期选择来源、输出目录，重新计算并执行 修正正常业绩口径.py、校验正常口径完整性.py。同业务日、源哈希不变且整表已通过核验的文件复用。不能仅因核心财务660项一致就认为整表合格。保留全部工作表、公式、源文件及完整活动分项、售罄、两平台推广、一级类目和前一日底表。\n\n免配使用同日已完成订单的完整快照，禁止用包含取消、未完成状态的订单总表直接计算；不能只按数据库较早的订单状态筛选来冒充最后已完成快照。美团推广遵循正常表的门店资金及推广范围，不混入总部商品推广；饿了么推广按原模板字段计算。利润仍取盈亏账单毛利，不额外扣推广，不改成订单商品估算毛利。一级类目保留正常一级源表及上期数据，不使用当前商品叶子节点简单加总替换原一级报表，不累计层级父子节点，也不能求和订单数或比率。完整正常底数已能取得时必须补齐，不能把人为留空当成正常生成。\n\n固定业务日期，避免TODAY改变历史文件日期。总览范围覆盖全部有效门店，保留原表既有合计、店均及单均口径。只有正常源表及数据库财务确实均缺失且原查找返回-1时，相关财务和无分母指标留空，合法负值和真实零值保留；独立推广及库存字段不因财务缺失被清空。营业时长等遗漏按同日同门店真实记录补齐。查不到源记录的曝光等指标留空，不显示-1。数据库只读。\n\n每次必须进行全部门店数值、总体及总体类目、所有正常底表完整性核验，逐店对照正常公式源结果；同时核对订单、实付、利润、成本与MySQL同日同平台同门店记录。原正常表本身的漏店、缺失哨兵、可核实营业时长等修正须有独立证据并留痕。输入被截断、混入取消单/总部推广、活动或售罄缺失、未解释数值差异时，整表核验不通过，禁止发送。先前的 填充新版公式每日底数.py、修复12号公式输入.py、补齐12号类目净销售.py 属于已发现缺口的试算流程，不再用作正式每日表格生成入口。\n\n8:30开始后检查本地/MySQL是否有更新且完整的新业务日底数；最新正常模板尚未发布时继续寻找同日完整底表并按正常映射生成，不能仅复制改名或沿用旧日活动、售罄、推广和退款快照。若关键源仍未齐，保留草稿及缺失清单，准确报告尚未齐的来源，不声称已生成或重复发送旧业务日文件。已有正常源覆盖的原始退款、商品和类目字段优先保留同一导出快照，避免将数据库不同采集时刻的叶子数据混进正式表。\n\n表格接收人已通过联系人搜索核实为营销组角色09，open_id 为 ${MESSAGE_ID_003}（不是角色07或角色08）。通过消息机器人CLI以本人角色01身份（--as user）发送两份经核对的业绩表及简短说明给角色09个人，记录真实业务日期、修正项与缺失数据。表格成功发送时先验证回执，再进入看板阶段；若登录或发送失败，记录准确原因，不声称已送达。必要时无损重压XLSX或按每份表单独打包，保留内容和全部工作表；超过附件上限可上传至飞书Drive并仅向角色09授予查看/下载权限，再用消息机器人CLI以本人身份（--as user）发送下载链接，不能开放给无关人员。不要只发“已完成”的文字而不交付文件。\n\n读取 MySQL 最新商品类目、动销、补货建议库存、库存快照和来源流量，使用 刷新数据库数据.py、补齐库存日期并压缩.py、库存格式.py 中已验证的数据映射。运行前核对并使日期参数适用于当天，保留真实历史快照用于对比，按各表实际最新日期更新。数据库只读，凭据继续使用现有本机解析方法，不打印、不打包、不发送凭据。动销按所选日期范围去重，不沿用会截断新日期的31天或64天位图限制；日期范围延长时应采用能覆盖实际周期的数据结构并验证。超过底数据覆盖的指标留空，不补造数据。\n\n用 发布库存接入.py 发布最新数据，保留 A/B 独立多选及联动门店筛选、单店标签、各模块日期、经营/投资/流量点击展开近30天A/B同图小趋势，两条线按各自周期结束日对齐，使用各自门店及日期、类目普通数值和排序下钻、一级类目固定表头、上涨红下降绿、双平台盈亏平衡线和页面内日期错误提示。对比期趋势必须使用B期门店和B期结束日，类目不加趋势图。页面默认周期结束日取最新业绩表日期，页面及说明分别写明业绩、商品/流量、库存的实际日期，不把较旧业绩冒充昨天数据。\n\n运行适用的数据与交互校验，重点核对源表汇总、各级类目汇总一致、库存/动销SKU口径、A/B范围独立和B趋势日期。参考 校验库存交互.cjs、校验日期交互.cjs、校验对比期趋势.cjs，历史固定断言须按真实源记录和当前日期调整，不能只改断言以掩盖错误。核心数据或校验失败时保留日志并报告准确原因，禁止发送错误文件。\n\n在 outputs\\布局原型_${REFERENCE_DATE_002}\\每日更新\\YYYY-MM-DD 下生成独立 ZIP，内含最新 门店经营洞察.html、使用说明.txt 和数据更新说明。全部数据和页面功能内置，下载解压后任何同事可用电脑 Edge/Chrome 打开，无需账号、安装程序、启动本地服务或连接数据库。压缩包须通过解压完整性与文件哈希校验；不得包含数据库配置、凭据或私人日志。保持文件大小适合飞书文件发送，必要时优化重复数据存储并验证结果一致。\n\n看板阶段发送身份必须为消息机器人 bot，看板发送目标仅为“业务群B”群，已核实 chat_id 为 ${MESSAGE_ID_004}。使用 im +messages-send，发送文件包及简短使用说明，说明各来源真实日期、当天更新内容和下载解压后浏览器打开的方法；表格仅发给前述角色09个人；看板不要发送给角色01个人或其他群。按运行日期和包哈希生成固定幂等键，保存文件、文字两条 message_id 和发送回执。结果不明先用 im +messages-mget 核查；部分成功只续发失败项，当日同版本已发送不重复发送。数据完全无新增且同一版本此前已发送时保持安静，不重复发旧包。\n\n看板金额、订单等保持现有区间合计口径，客单价、单均、比率按区间汇总加权计算；用户已明确暂不调整为区间均值，不擅自改为日均或店日均。今天发送流程可参考 发送今日交付.py，按运行日及每份文件/包的哈希形成固定幂等键，保存表格、说明、看板全部message_id。部分成功只续发失败项，先用messages-mget核查消息存在和准确目标；表格以--as user核验发件人为角色01（${MESSAGE_ID_002}），看板以--as bot核验发件人为消息机器人（${MESSAGE_ID_001}）；不重复发送已成功同版本。不打印或打包凭据、数据库配置、私人日志。\n\n正常完成后在群内交付文件和说明即可，当前聊天保持安静；仅在更新/校验/发送失败、登录过期或需要用户处理时通知。不要改动其他自动任务。\n\n${REFERENCE_DATE_001}用户明确授权“按指定发送角色的方式发（本人账号）”。表格发送身份为消息机器人CLI --as user，对应本人角色01；这项授权取代此前表格必须使用bot的限制。已核实角色09本人账号私聊chat_id为${MESSAGE_ID_005}；表格只能交付上述角色09，不向角色02或其他人发送。看板仍必须用消息机器人bot发到上述“业务群B”群。无需为角色09启用机器人或申请应用可用范围权限。保存两种身份分别对应的回执；同日同版本已成功交付的不重复发送。参考发送今日交付.py的--stage tables与--stage dashboard分阶段执行，先表格发送并核验，再更新看板并群交付。${REFERENCE_DATE_001}看板群交付已成功，不重发当日同版本。\n\n已新增经营指标“总毛利”和“日均订单数”，必须保留。两项按A/B各自选择的平台、门店和周期计算：美团为美团，饿了么为饿了么，同时选择或未限制平台则两平台合计；日均订单=对应订单合计/所选区间自然天数，门店组不除门店数，保留两位小数。这是新增行，不把原金额、订单合计行改成均值。其余原指标仍沿用已有美团业绩口径，页面说明明确区分。运行读取平台毛利.py后再发布，保留美团已接入源表的历史版本，饿了么读取真实MySQL财务记录；核对最近已计算业务日，一并记录历史源表与数据库版本差异，不静默覆盖旧业绩。缺财务底数的区间及趋势日期留空，真实零值保留。新增两项支持A/B同图小趋势。追加校验新增经营指标.cjs，核对单平台、双平台、自然天数、多店合计、A/B平台独立及缺失留空。\n\n用户在${REFERENCE_DATE_005}明确要求修正正式表核对发现的差异，并从此每天按正常逻辑生成新的业绩表。今日正式修正版目录为 outputs\\两平台公式表_${REFERENCE_DATE_006}\\12号正式修正版；以实际整表核验通过后的计算记录为准，旧的部分底数试算版不可发送。今后日期和目录动态选择。每日8:30、角色09本人账号发送及业务群B群bot发送的顺序和授权均保持不变。"
