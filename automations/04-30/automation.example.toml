name = "每日原始报表下载与接口核验（08:00，八份）"
status = "PAUSED"
source_status = "ACTIVE"
timezone = "Asia/Shanghai"
rrule = "FREQ=DAILY;BYHOUR=8;BYMINUTE=0;BYSECOND=0"
template_only = true
prompt = "按北京时间（Asia/Shanghai）每天08:00执行KA门店维度原始报表下载，并检查本地牵牛花接口文件。只下载和核验，不做分析；其他分析任务时间和统计口径不变。\n\n业务日期为运行日T-1，目录${LOCAL_PATH_001}，YYYYMMDD为业务日期。\n\n本地Windows任务：QNH-Raw-API-0430在04:30通过9223接口下载经营、订单商品明细、品类分门店、配送全门店；QNH-Raw-API-0800在08:00先下载流量门店排行，流量程序退出后顺序调用tools\\activity_raw_api.cjs下载活动明细“商品→门店维度”的美团闪购100、饿了么200两份。活动明细按日、T-1、全部有权限门店、7项指标。活动查询超过45,000行自动按互不重叠门店分段导出并合并，禁止把平台截断的50,000行文件或空表记完成。\n\n先检查目标目录中的接口下载记录.json、活动明细接口下载记录.json及实际Excel。若run_daily_raw_api.ps1、daily_raw_api.cjs或activity_raw_api.cjs同日期进程正在运行，等待其完成，不另起并发进程。牵牛花上述七份表只用接口，禁止报表页面点击下载；会话使用隔离9223，不操作普通Chrome。\n\n确有缺失且无本地下载进程运行时：流量用${LOCAL_PATH_002} -Slot 0800（流量后会顺序检查两渠道活动明细）；04:30文件用node tools\\daily_raw_api.cjs --date YYYY-MM-DD --kinds 实际缺失类型，类型business,order,category,delivery；活动明细用node tools\\activity_raw_api.cjs --date YYYY-MM-DD --channels 实际缺失渠道（100或200，均缺则100,200）。有效文件、已下载分段、已有task_id自动复用。已有任务校验为空确需重新生成时仅对实际缺失类型用--repair-invalid；提交结果未确认时禁止重复提交。\n\nKA只使用已登录的专属直连Chrome，禁止9223/9225及其他下载路径。打开${SERVICE_URL_001}，进入数据报表，核对T-1实际日期，查询，切换“按门店查看”，表头必须含门店名称、门店ID，横向滚动至右侧下载。先检查同日期有效KA文件，已有则复用，禁止重复点击生成。只有文件实际落盘且含正确日期及门店明细才成功。美团商家版维持原下载方式。\n\n最终核验八份：经营、订单商品明细、品类分门店、配送全门店、流量门店排行、KA门店维度、美团闪购活动商品门店明细、饿了么活动商品门店明细。活动文件名为活动明细_商品_门店维度_美团闪购_YYYYMMDD.xlsx及活动明细_商品_门店维度_饿了么_YYYYMMDD.xlsx。核对两渠道活动记录status=complete、valid=true、完整明细行数与查询总行数相符；分段须全部完成、无重叠，再合并为每渠道一份。运行python tools\\record_eight_daily.py YYYY-MM-DD 业务目录生成八份下载核验记录。八份全部实际有效才标记完成；失败写具体原因。常规健康状态保持安静，只在下载完成、失败或需重新登录时通知。"
