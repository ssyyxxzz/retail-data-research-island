name = "每日更新门店活动调整看板"
status = "PAUSED"
source_status = "ACTIVE"
timezone = "Asia/Shanghai"
rrule = "FREQ=DAILY;BYHOUR=17;BYMINUTE=0;BYSECOND=0"
template_only = true
prompt = "每天北京时间17:00检查 ${LOCAL_PATH_009} 的活动调整看板。以当天通过看板上传的ZIP压缩包为更新依据：先读取 tools\\activity_board\\uploads\\bundles.json 和 data.json，按实际上传时间及包内明确日期识别门店、底表、调整后文件；上传到看板即可形成每日调整记录，状态保持“已上传至看板 · 平台生效待核”，不能表述为已上传或已生效到业务平台，也不必再向用户索要这些已可见压缩包的门店名单。若有本机生成但未上传到看板、又需要纳入当天更新的文件，先在本聊天询问用户具体哪些门店已上传；未获明确答复前不把这些本机文件记为已上传。没有任何当天新增或实质变化时保持安静，也不向业务群A发送。发现新看板上传时，核对门店别名、底表和调整后路径并运行 python tools\\activity_board\\board.py；每家店取最后一版展示快消、快消百货、百货折扣均值及历史，保留同日不同版本、反复调整SKU分类与次数、分店工作表和手工趋势备注。调前3个自然日与调后3个自然日（排除当天）的美团订单、线上毛利、单均毛利，使用 ${LOCAL_PATH_027} 每日消息机器人发送群内表格同口径的“美团闪购”数据；优先已发送重点门店文件，其余用同次全部门店文件。每天选同一17:55时段快照，标注为当时实时值；缺任一日期不算差额，不混其他渠道或旧汇总源。9月25至27日中秋不计；后3天有其他调整需标注；窗口金额不可累加为总收益。原始文件不修改。刷新后核验新增记录、门店、文件路径和导出文件，检查固定443 HTTPS看板链接及 public_board.py 服务。当天有新增或实质调整时运行 python tools\\activity_board\\send_announcement.py --date YYYY-MM-DD --send（日期替换为北京时间当天），由消息机器人向飞书业务群A群只发送逐店最后一版的调整SKU数、上调/下调数、三类折扣均值变化文字摘要及同一个固定看板链接，不发送压缩包。发送脚本保存幂等回执；结果不明先核查回执，不盲目重发。仅在取得文字message_id后报告已群发；失败则报告准确错误并保留成果。"
