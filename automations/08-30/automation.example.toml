name = "每日08:30牵牛花五店三表导出"
status = "PAUSED"
source_status = "PAUSED"
timezone = "Asia/Shanghai"
rrule = "FREQ=DAILY;BYHOUR=8;BYMINUTE=30"
template_only = true
prompt = "每天早上08:30（Asia/Shanghai）在 ${LOCAL_PATH_003} 执行牵牛花三表导出。必须使用隔离 Google Chrome：程序路径 ${EXECUTABLE_001}，启动脚本 ${LOCAL_PATH_004}，远程调试端口 9223，用户目录 ${LOCAL_PATH_005}。若 9223 不可连接，先运行该脚本并等待端口监听；登录失效时停止并通知，禁止重复提交任务。先记录本次开始时间，只处理开始时间之后的新任务。第一部分进入商品→门店商品，清空原筛选。${BUSINESS_IDENTIFIER_001}、${BUSINESS_IDENTIFIER_002}、${BUSINESS_IDENTIFIER_003}、${BUSINESS_IDENTIFIER_004}、${BUSINESS_IDENTIFIER_005} 是门店ID，不是SKU。在门店ID查询框输入“${BUSINESS_IDENTIFIER_001},${BUSINESS_IDENTIFIER_002},${BUSINESS_IDENTIFIER_003},${BUSINESS_IDENTIFIER_004},${BUSINESS_IDENTIFIER_005}”并回车，核对并逐行勾选：${BUSINESS_IDENTIFIER_001} 示例零售门店（示例门店〈20〉）、${BUSINESS_IDENTIFIER_002} 示例零售门店（示例门店〈10〉）、${BUSINESS_IDENTIFIER_003} 示例零售门店（示例门店〈33〉）、${BUSINESS_IDENTIFIER_004} 示例零售门店（示例门店〈16〉）、${BUSINESS_IDENTIFIER_005} 示例零售门店（示例门店〈41〉）；必须显示已选门店(5)后确认并查询。导出→导出门店商品→保留默认字段→确定导出；再导出→导出活动商品，出现任务处理中即停止点击。去任务→批量任务：任务类型“Excel导出门店商品”，等待本次最新任务完成并下载；任务类型“门店商品-导出活动品信息”，等待本次最新任务完成并下载。第二部分进入数据→商品详情→按商品→按周；打开门店选择器，取消选择全部并清空已有门店。这里不得粘贴ID，必须按全名逐一搜索并勾选：示例零售门店（示例门店〈20〉）、示例零售门店（示例门店〈10〉）、示例零售门店（示例门店〈33〉）、示例零售门店（示例门店〈16〉）、示例零售门店（示例门店〈41〉）。核对恰好五家，查询，滚到最下方导出。去任务→批量任务，清空任务类型并查询全部，只认本次开始时间之后最新的“导出商品详情商品明细…”任务，完成后点下载报表导出数据。三个文件下载完成后，必须按执行日期YYYYMMDD重命名为：第一个“五店商品_YYYYMMDD.xlsx”，第二个“五店活动商品_YYYYMMDD.xlsx”，第三个“五店近7日销售数据_YYYYMMDD.xlsx”。最终文件统一保存到 ${LOCAL_PATH_006}；如果该文件夹不存在，先创建。下载文件可以先落到系统下载目录，但验证后必须移动到 ${LOCAL_PATH_006}，不要在下载目录保留重复副本。同日重跑时，只有在三个新文件均下载并验证成功后，才更新当天同名文件。最终核验 ${LOCAL_PATH_006} 中这三个xlsx文件存在、非空并可正常打开，报告完整路径、大小和任务创建时间；不得复用历史任务，失败时说明卡点。"
