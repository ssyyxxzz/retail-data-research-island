name = "翱象底表07:30及实付毛利预警群发送"
status = "PAUSED"
source_status = "ACTIVE"
timezone = "Asia/Shanghai"
rrule = "FREQ=DAILY;BYHOUR=7;BYMINUTE=30;BYSECOND=0"
template_only = true
prompt = "从${REFERENCE_DATE_001}起，每天北京时间（Asia/Shanghai）07:30，在当前固定任务执行“翱象底表下载、合并、校验并由消息机器人连同实付和毛利预警发送到业务群C”。业务日期动态取运行日T-1，只处理前一天单日数据。配置在work/daily_schedule_config.json。\n\n浏览器和下载：\n只在后台使用隔离Chrome：翱象端口9222、独立用户目录Chrome-Automation；饿了么/淘宝闪购底表端口9224。不能将窗口置顶、抢占前台或操作主Chrome。优先复用已登录会话及本线程已经抓取验证的接口和脚本；加载或导出慢时分段等待，必要时刷新一次，不反复重启。登录失效时通知用户登录，不循环提交任务。\n\n每天07:00的独立任务automation-3会把四份饿了么/淘宝闪购报表保存到${LOCAL_PATH_030}：店铺活动_YYYYMMDD.xlsx、商品活动_YYYYMMDD.xlsx、红包活动_YYYYMMDD.xlsx、流量转化_YYYYMMDD.xlsx。07:30先检查同日文件、SUCCESS任务、表内日期、有效内容；未齐且仍在生成时以20-30秒间隔等待，最长20分钟。不要重复导出这四份底表，不修改07:00独立任务。等待后仍缺文件则报告准确缺项，不复用旧日期数据冒充当天结果。\n\n下载翱象前一天数据，源文件保存在${LOCAL_PATH_031}。优先接口方式，记录日期、渠道、任务ID和完成状态。已有同业务日有效文件时复用；已有生成中任务时继续等待。每种任务只提交、下载一次，不能多次点击产生副本。\n已验证的动态下载脚本：work/daily_background_query.mjs可在9222隔离会话执行表达式；work/daily_export_tasks.js动态取T-1并先查历史，只有缺任务才创建补货、门店排行和订单毛利三项，结果存work/export_tasks_YYYYMMDD.json（运行日）。不要执行固定日期的today_create_exports.js。补货必须跟踪创建返回的原始taskId：work/wait_stock_export.mjs YYYY-MM-DD \"原始数据目录\" work/stock_task_YYYYMMDD.json 原始taskId，每30秒查询，只有FINISHED且无失败才下载完整ZIP。使用该脚本中的三个taskCodes联合查询口径，不使用仅单个补货taskCode的查询返回的临时GEI任务替代原始任务。补货预计耗时可长于其他表，等待已有任务，不重复提交、不重启Chrome。\n补货完成时数字taskId可能转换为GEI编号：只允许以原始任务已记录的同一startTime、相同任务类型及完整明细数量核实完成记录，不取临时GEI任务。完整ZIP优先从stock_task记录中以.zip结尾的OSS fileUrl下载：node work/download_primary_stock.mjs work/stock_task_YYYYMMDD.json \"原始数据目录\"，流式写入.part，完成后才改为.zip。若仅返回.xlsx的GEI记录，等待主任务记录或进入原始“补货建议→历史记录”，按原始操作时间和成功数量点击一次下载，用work/capture_cdp_download_multi.mjs捕获真正“补货建议导出服务_*.zip”，排除伴随的单表。/gei/import/task/errorFile/<taskId>不是补货完整ZIP下载接口，禁止用它替代主文件。导出压缩包较大，下载可能需要数分钟，不重复点击。必须确认ZIP内部多门店xlsx数量、全部SKU明细和纳入门店匹配后处理。\n经营分析下载菜单已验证为悬停触发；work/capture_export_formatted.mjs核对日期=昨日和渠道=[ELE]后悬停下载并点击“导出格式化数据”的实际子菜单，不能仅点击外围li。提交后在下载管理按本次生成时间及成功状态核实新文件再下载；无请求或新任务证据时先检查列表，不能盲目重复导出。页面切换慢时等待挂载；隐藏旧iframe不要当作当前经营页面。\n1. 采购→补货建议→导出→全部信息导出→确认→历史记录→最新成功任务下载。应为全部门店补货建议完整ZIP，不得使用单门店文件替代；校验内部门店数和有效明细。\n2. 数据→经营分析→经营详情，日期=昨日，不改指标筛选；下载→导出格式化数据→数据下载/下载管理→最新成功任务下载。经营分析Sheet原样保留导出data内容。同时必须取得同日、渠道仅淘宝闪购的经营详情数值供数据Sheet计算，避免全渠道合计混入；可用当前页面的已验证接口或getStructuredContent一次取全部门店。将核验来源保存为work/business_all_rows_YYYYMMDD.json，YYYYMMDD为业务日期。确认页面日期和淘宝闪购渠道，不使用历史缓存。\n3. 数据→门店分析，日期=昨日→下载→历史记录→最新完成任务下载“门店排行”。\n4. 数据→盈亏→订单毛利分析，创建时间=昨日，查询→导出订单毛利明细→最新成功任务下载，校验创建日期和渠道字段。\n\n用本地最快的流式方法处理：work/fast_xlsx_rows.py读取来源；work/stock_current_fast.py以XML流式读取必要字段并并行汇总补货ZIP；已计算的同日摘要直接复用，不再重复读完整补货文件。以下脚本已经支持动态日期，不受文件名中${REFERENCE_DATE_012}限制。统一传入--date YYYY-MM-DD（业务日期）和--source-dir ${LOCAL_PATH_032}：\npython -X utf8 -u work/stock_current_fast.py\npython -X utf8 -u work/prepare_daily_base_${REFERENCE_DATE_012}.py\npython -X utf8 -u work/build_daily_base_${REFERENCE_DATE_012}.py\n不要直接执行旧版固定日期更新脚本或重新生成10月12日文件。可传--template指定最近有效底表；首次可用${LOCAL_PATH_033}。开业时间来源为${LOCAL_PATH_034}“认证列表”Sheet，按“门店名称”匹配“开业时间”；这是用户最新指定来源，替代旧1012上线时间表，不以旧表或预计上线时间补缺。\n\n字段、口径和版式：\n保留四个Sheet：数据、经营分析、缺货数据表、总体业绩，不增加计算口径Sheet。仅纳入渠道=淘宝闪购，关键业务数据全0门店不分析。\n开业天数放第一列，随后平台、门店名称；门店名称后立即放四个毛利字段：门店昨日毛利（不含货返）、门店昨日单均毛利（不含货返）、门店昨日毛利（包含货返）、单均毛利（包含货返）。使用work/daily_layout.py统一排版。\n不含货返毛利=同日淘宝闪购经营分析“预计毛利”，与门店排行逐店核验。包含货返毛利=同日创建日期、渠道淘宝闪购的订单毛利明细“预计毛利”按订单编码去重后按门店汇总；保留本次导出订单状态，不擅自统一两种来源的退款口径。各自单均毛利均除以门店排行用户实付订单量。\n订单数=门店排行用户实付订单量；实付金额=用户实付营业额；商品原价=同日淘宝闪购经营分析商品原价；商品成本=采购成本；商品成本率=商品成本/商品原价；昨日自营销力度=营销活动费用/商品原价。\n单均配送费=（同日淘宝闪购经营分析自配送费用+平台配送服务费）/用户实付订单量，字段名为“单均配送费”，不能再直接填总费用。\n真实上线时间列取新来源“开业时间”；精确日期的开业天数=业务日期-开业日期+1，上线当日为1天。“7月前”等模糊日期保留原文，开业天数填“日期不详”，两项标黄并备注精确日期未提供；缺失标黄，不使用旧表或预计日期填补。\n单均红包支出=红包底表商家补贴金额加和/总订单数。\n单均报名活动支出=商品活动中活动来源为“平台招商”的商家补贴金额加和/总订单数。\n单均爆品支出=商品活动中活动来源为“商家端PC”且活动名称包含爆品、0.01或单品的商家补贴金额加和/总订单数。\n单均普通折扣=商品活动剔除报名活动和爆品后其余商家补贴金额加和/总订单数。商品分类必须互斥，分类金额合计与商品活动补贴总额一致。\n单均减配活动支出=店铺活动中活动名称包含“配送”的商家补贴金额加和/总订单数。\n以上总订单数统一为门店排行用户实付订单量，不把活动明细反复出现的门店总订单量加总；单均活动支出合计为上述五项之和。不含配送的其他店铺活动不混入五项。\n日均曝光人数=单日流量转化表总曝光人数；入店转化率、下单转化率取流量底表平台原值。对门店名称规范化括号和空格后匹配，防止串店。缺字段或空值标记并在数据备注注明，不擅自填0。\n缺货八项：库存0；在途不为0；月销不为0且库存0；月销不为0且库存0且在途0；月销>=2且库存0；月销>=2且库存0且在途0；月销>=5且库存0；月销0且库存0。空缺的数值行不计入，标注行数。总体业绩单均指标用总金额/总订单数，不简单平均门店单均值；总转化率由人数汇总计算。\n\n最终文件名“翱象底表-M.D（数据M.D）.xlsx”，前者是生成日、括号中是前一天业务日期，存${LOCAL_PATH_035}；文件内明确业务日期和生成日期。不覆盖其他日期。同日已有正确结果可复用。校验四Sheet、字段顺序、日期、淘宝闪购筛选、门店匹配、费用归类、全部汇总和公式错误后才发送；保留经营分析原始业务数据。\n\n发送已由用户明确授权，收件目标从方嘉炜改为“业务群C”，每天底表连同实付和毛利预警一起发送，今天正式底表也可发送。必须用飞书机器人“消息机器人”，CLI profile=${MESSAGE_ID_001}、--as bot；唯一目标群chat_id=${MESSAGE_ID_007}，群名已通过同profile用户搜索唯一核实。发送脚本：python -X utf8 -u work/send_daily_to_group.py --date YYYY-MM-DD --file \"最终Excel绝对路径\" --send。不再执行send_daily_to_fang.py。禁止改为用户本人、消息机器人以外的机器人、其他人或群。脚本核验消息机器人身份及群可见性，文件和预警文字各有独立固定幂等键，保存${LOCAL_PATH_036}、Excel快照和预警快照。每项存在message_id表示已发送，跳过已发送项；未知结果先检查回执和群记录，不盲目重发。成功须确认文件和预警两项message_id。若消息机器人不在群或无权限则通知用户将消息机器人加入该群，不擅自更换身份；保留文件并准确报告未送达。\n\n实付和毛利预警：使用work/check_daily_alerts.py --date YYYY-MM-DD --file \"最终Excel绝对路径\"读取${LOCAL_PATH_037}、自然日连续的有效底表。实付=门店昨日实付金额；毛利默认=门店昨日毛利（不含货返）。两项分别判断条件A：最新值较前一天值下降超过20%，即最新值/前一天值-1 < -20%；前一天值0、负数或缺失时不计算百分比，不擅自补0。条件B：最近连续三天都有数据且两天前值>前一天值>最新值。任一指标任一条件触发即提醒，不要求实付和毛利同时触发；同店合并展示。列出指标、前日和最新金额、单日降幅（展示3位百分比小数）和触发原因；连续下降时列三天金额。缺自然日历史或单店指标缺失需明确说明暂不能判断，不能声称无预警；历史充分且无触发时报告无实付或毛利预警。预警随当天Excel一并发到已确认群，单独文字消息，不增加Sheet、不改变既有四Sheet。\n完成通知简要报告业务日期、纳入门店数、最终文件路径、发送到业务群C的文件及预警结果/回执。失败说明具体卡点、已完成步骤和文件位置。无状态变化时不反复通知。"
